<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Splat Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-family: sans-serif; font-size: 18px;
      background: #111; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loading">Loading splat...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    // ---- CHANGE THIS to your Cloudflare R2 public URL once uploaded ----
    // Example: "https://pub-xxxxxxxxxxxx.r2.dev/model.splat"
    const SPLAT_FILE = "https://pub-478dccc9b2c545d9b1ed402647bbc062.r2.dev/export_20000_compressed_fast.sog";
    // ----------------------------------------------------------------------

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.01, 1000
    );
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Orbit controls so people can rotate/pan/zoom with mouse or touch
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Spark renderer, added to the scene like any other object
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    // Load your splat file
    const splat = new SplatMesh({ url: SPLAT_FILE });
    splat.quaternion.set(1, 0, 0, 0);
    scene.add(splat);

    splat.initialized.then(() => {
      document.getElementById("loading").style.display = "none";
    }).catch((err) => {
      document.getElementById("loading").textContent =
        "Failed to load splat file. Check the file name/path.";
      console.error(err);
    });

    // Handle window resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
